name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, openssl, json, zlib, intl, mbstring, fileinfo
      - name: Validate Composer configuration
        # --strict is intentionally omitted because the deliberate exact
        # symfony/process pin triggers Composer's semver warning.
        run: composer validate
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHPStan static analysis
        run: vendor/bin/phpstan analyse
      - name: PHP coding standards
        run: vendor/bin/phpcs --standard=phpcs.xml
      - name: HPP unit tests
        run: vendor/bin/phpunit --testsuite hpp-unit
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit
