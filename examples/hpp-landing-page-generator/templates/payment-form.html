        <main class="payment-section">
            <div class="payment-card">
                <h2>Payment Details</h2>
                <div class="payment-info">
                    <p><strong>Amount:</strong> <span class="amount">{{CURRENCY}} {{AMOUNT}}</span></p>
                </div>
                
                <form id="payment-form" method="POST" action="{{HPP_URL}}">
                    {{HPP_FIELDS}}
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            Pay {{CURRENCY}} {{AMOUNT}}
                        </button>
                        <a href="{{CANCEL_URL}}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
                
                <div class="security-notice">
                    <svg class="security-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Your payment is secured with industry-standard encryption</span>
                </div>
            </div>
        </main>
